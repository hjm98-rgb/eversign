name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make git curl unzip zip xz-utils libssl-dev pkg-config libxml2 libxml2-dev libplist-dev

      - name: Set up Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          ls $HOME/theos || true

      - name: Fetch iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p $HOME/theos/sdks
          cp -R /tmp/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/
          ls $HOME/theos/sdks

      - name: Fetch ldid (iOS arm64)
        run: |
          mkdir -p EverSign/Resources
          curl -sL -o EverSign/Resources/ldid https://github.com/opa334/ldid/releases/latest/download/ldid
          chmod +x EverSign/Resources/ldid
          ls -l EverSign/Resources/

      - name: Generate own signing cert
        run: mkdir -p EverSign/Resources && bash scripts/gen-cert.sh EverSign/Resources/victim.p12

      - name: Build persistence helper
        run: |
          make -C Helper FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0
          BIN=$(find Helper/.theos/obj -type f -name ESHelper | head -1)
          echo "helper: $BIN"
          cp "$BIN" EverSign/Resources/ESHelper
          chmod +x EverSign/Resources/ESHelper
          file EverSign/Resources/ESHelper

      - name: Build
        run: |
          make -C EverSign FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0
          APP="EverSign/.theos/obj/EverSign.app"
          LDID=$(find $THEOS -name ldid -type f -perm -u+x | head -1)
          echo "using ldid: $LDID"
          $LDID --version || true
          cp EverSign/Info.plist "$APP/Info.plist"
          "$LDID" -K"$PWD/EverSign/Resources/victim.p12" -S"$PWD/EverSign/entitlements.plist" "$APP/EverSign"
          echo "--- entitlements ---"
          "$LDID" -e "$APP/EverSign" | head -40
          ls -la "$APP"

      - name: Build installer entry app
        run: |
          APP="EverSign/.theos/obj/EverSign.app"
          mkdir -p Installer/Resources/Payload
          rm -rf Installer/Resources/Payload/EverSign.app
          cp -R "$APP" Installer/Resources/Payload/EverSign.app
          cp EverSign/Resources/victim.p12 Installer/Resources/victim.p12
          cp EverSign/Resources/ldid Installer/Resources/ldid
          chmod +x Installer/Resources/ldid
          make -C Installer FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0
          IAPP="Installer/.theos/obj/ESInstallApp.app"
          LDID=$(find $THEOS -name ldid -type f -perm -u+x | head -1)
          cp Installer/Info.plist "$IAPP/Info.plist"
          "$LDID" -Hsha256 -S"$PWD/Installer/entitlements.plist" "$IAPP/ESInstallApp"
          echo "--- installer signature slots ---"
          "$LDID" -h "$IAPP/ESInstallApp" || true
          echo "--- installer app ---"
          ls -la "$IAPP"
          ls -la "$IAPP/Payload" || true

      - name: Package IPA
        run: |
          APP="EverSign/.theos/obj/EverSign.app"
          if [ ! -d "$APP" ]; then echo "app bundle not produced"; exit 1; fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../EverSign.ipa Payload
          ls -lh ../EverSign.ipa

      - name: Package installer deb
        run: |
          IAPP="Installer/.theos/obj/ESInstallApp.app"
          if [ ! -d "$IAPP" ]; then echo "installer app not produced"; exit 1; fi
          rm -rf debroot
          mkdir -p debroot/DEBIAN debroot/var/jb/Applications
          cp -R "$IAPP" debroot/var/jb/Applications/
          cat > debroot/DEBIAN/control <<'EOF'
          Package: com.hjm.eversign.installer
          Name: EverSign Installer
          Version: 1.2.0
          Architecture: iphoneos-arm64
          Description: Entry app that installs EverSign as a system app via the CoreTrust flaw
          Maintainer: hjm
          Author: hjm
          Section: Applications
          EOF
          cat > debroot/DEBIAN/postinst <<'EOF'
          #!/bin/bash
          chown -R root:wheel /var/jb/Applications/ESInstallApp.app
          find /var/jb/Applications/ESInstallApp.app -type d -exec chmod 755 {} \;
          find /var/jb/Applications/ESInstallApp.app -type f -exec chmod 644 {} \;
          find /var/jb/Applications/ESInstallApp.app -type f -perm /111 -exec chmod 755 {} \;
          uicache -a 2>/dev/null || true
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          EOF
          chmod 755 debroot/DEBIAN/postinst
          dpkg-deb --root-owner-group -Zxz --build debroot EverSignInstaller.deb
          ls -lh EverSignInstaller.deb

      - uses: actions/upload-artifact@v4
        with:
          name: EverSign-ipa
          path: EverSign.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: EverSign-installer-deb
          path: EverSignInstaller.deb
